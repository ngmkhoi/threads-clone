<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Redirecting...</p>
    </div>

    <script>
        // Lấy current path và query
        const path = window.location.pathname;
        const search = window.location.search;
        const urlParams = new URLSearchParams(search);
        const token = urlParams.get('token');

        // Base URL cho GitHub Pages
        const baseUrl = '/threads-clone/';

        // Fix duplicate /verify-email/verify-email
        if (path.includes('/verify-email/verify-email') || path.includes('/verify-email')) {
            if (token) {
                // Redirect về hash router URL đúng
                window.location.replace(baseUrl + '#/auth/verify-email?token=' + encodeURIComponent(token));
            } else {
                window.location.replace(baseUrl + '#/auth/login');
            }
        } else {
            // Các path khác, redirect về home
            window.location.replace(baseUrl);
        }
    </script>
</body>
</html>
